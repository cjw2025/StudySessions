<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Study Groups</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 450px;
      max-width: 95%;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      padding: 10px;
      width: 80%;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background-color: #2575fc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button:hover {
      background-color: #1a5fd0;
    }
    .group-card {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      text-align: left;
    }
    .group-card h3 {
      margin: 0 0 5px;
      color: #444;
    }
    .group-card p {
      margin: 3px 0;
      color: #666;
    }
    .join-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .join-btn:hover {
      background-color: #218838;
    }
    .back-btn {
      margin-bottom: 15px; 
      background:#667eea; 
      color:white; 
      border:none; 
      padding:10px 20px; 
      border-radius:5px; 
      cursor:pointer;
    }
    .back-btn:hover {
      background:#5a54d4;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ✅ Back to Dashboard button -->
    <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>

    <h1>Search Groups</h1>
    <input type="text" id="searchInput" placeholder="Search by subject, class, or group name..." />
    <br />
    <button onclick="searchGroups()">Search</button>
    <div id="results"></div>
  </div>

  <script>
    // Example groups (local for now, backend will replace this later)
    const groups = [
      { group_name: "Calc II Study Buddies", subject: "Mathematics", description: "Weekly problem-solving sessions.", meeting_location: "Math Building Room 101", meeting_time: "10:00 AM", meeting_days: "Tuesday, Thursday" },
      { group_name: "Bio Lab Prep", subject: "Biology", description: "Study group for lab quizzes and reports.", meeting_location: "Science Hall Room 12", meeting_time: "1:30 PM", meeting_days: "Monday, Wednesday" },
      { group_name: "History Discussion Group", subject: "History", description: "Discussion-based group for essay prep.", meeting_location: "Online - Zoom", meeting_time: "6:00 PM", meeting_days: "Thursday" }
    ];

    function searchGroups() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      const filtered = groups.filter(group =>
        group.group_name.toLowerCase().includes(query) ||
        group.subject.toLowerCase().includes(query) ||
        group.description.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        resultsDiv.innerHTML = "<p>No groups found.</p>";
        return;
      }

      filtered.forEach(group => {
        const div = document.createElement("div");
        div.className = "group-card";
        div.innerHTML = `
          <h3>${group.group_name}</h3>
          <p><strong>Subject:</strong> ${group.subject}</p>
          <p>${group.description}</p>
          <p><strong>When:</strong> ${group.meeting_days} at ${group.meeting_time}</p>
          <p><strong>Where:</strong> ${group.meeting_location}</p>
          <button class="join-btn" onclick="joinGroup('${group.group_name}')">Join</button>
        `;
        resultsDiv.appendChild(div);
      });
    }

    function joinGroup(groupName) {
      alert("✅ Request sent to join " + groupName + "!");
      // 🔮 Later: send to backend with fetch("/api/join")
    }
  </script>
</body>
</html>
