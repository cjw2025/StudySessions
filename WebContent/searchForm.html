<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 StudySessions - Find Study Groups</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8f9fa;
        }

        /* Header - IDENTICAL TO userDashboard.html */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* USER AREA - FULL NAME + DASHBOARD LINK + LOGOUT */
        .user-area {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.95rem;
        }

        .user-greeting {
            text-align: right;
        }

        .user-greeting .greeting {
            font-style: italic;
            margin-bottom: 2px;
        }

        .user-greeting span#fullUserName {
            font-weight: 600;
            color: white;
        }

        .user-greeting .dashboard-link {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255,255,255,0.6);
            transition: all 0.2s;
        }

        .user-greeting .dashboard-link:hover {
            color: white;
            border-bottom-color: white;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        /* Main Content */
        .search-section {
            padding: 140px 2rem 80px;
            text-align: center;
        }

        .search-section h2 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 1.5rem;
        }

        .search-section p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .search-bar {
            max-width: 700px;
            margin: 0 auto 3rem;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 50px;
            overflow: hidden;
        }

        #searchInput {
            flex: 1;
            padding: 18px 24px;
            border: none;
            font-size: 1.1rem;
            outline: none;
        }

        #searchBtn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0 32px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        #searchBtn:hover {
            background: #5a6fd8;
        }

        /* Results Table */
        .results-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
        }
        .results-container.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background: #f0f0ff;
        }
        .join-button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .join-button:hover {
            background: #0d8f63;
            transform: translateY(-2px);
        }

        /* Toast & Modal */
        .toast-container { position: fixed; top: 100px; right: 20px; z-index: 9999; pointer-events: none; }
        .toast { background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; min-width: 300px; animation: slideIn .3s ease, fadeOut .3s ease 2.7s; opacity: 0; animation-fill-mode: forwards; border-left: 4px solid #10b981; }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 2rem; border-radius: 16px; max-width: 450px; width: 90%; text-align: center; }
        .modal h3 { margin-bottom: 1rem; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }
        .modal-btn { padding: 12px 24px; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; }
        .modal-btn.cancel { background: #e5e7eb; color: #374151; }
        .modal-btn.confirm { background: #10b981; color: white; }
    </style>
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Join Confirmation Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>Join Study Group?</h3>
            <p>Are you sure you want to join "<span id="modalGroupName"></span>"?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn confirm" onclick="confirmJoin()">Join Group</button>
            </div>
        </div>
    </div>

    <header>
        <nav>
            <div class="logo">📚 StudySessions</div>
            <div class="nav-links">
                <a href="searchForm.html">Find Groups</a>
                <a href="myGroups.html">My Groups</a>
                <a href="createGroup.html">Create Group</a>

                <div class="user-area">
                    <div class="user-greeting">
                        <div class="greeting">Hi, <span id="fullUserName">User</span>!</div>
                        <a href="userDashboard.html" class="dashboard-link">My Dashboard</a>
                    </div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="search-section">
        <h2>Find Your Study Group</h2>
        <p>Search by class name, code, subject, or group name</p>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="e.g. CS101, Biology, Math Study Buddies..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Class</th>
                        <th>Code</th>
                        <th>Subject</th>
                        <th>Group Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let groupToJoin = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Load full name on page load
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (user?.firstName) {
                const firstName = user.firstName || 'User';
                const lastName = user.lastName || '';
                const fullName = `${firstName} ${lastName}`.trim() || 'User';
                document.getElementById('fullUserName').textContent = fullName;
            }
        });

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsTableBody = document.getElementById('resultsTableBody');
        const resultsContainer = document.getElementById('resultsContainer');

        searchBtn.addEventListener('click', searchStudyGroups);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') searchStudyGroups();
        });

        async function searchStudyGroups() {
            const query = searchInput.value.trim();
            if (!query) {
                showToast('Please enter a search term', 'error');
                return;
            }

            try {
                const response = await fetch(`/webproject/api/groups/search?query=${encodeURIComponent(query)}`);
                const groups = await response.json();

                resultsTableBody.innerHTML = '';

                if (groups.length === 0) {
                    resultsTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 3rem; color: #666;">No groups found. Try a different search term!</td></tr>';
                } else {
                    groups.forEach(group => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${group.className}</td>
                            <td>${group.classCode}</td>
                            <td>${group.subject}</td>
                            <td>${group.groupName}</td>
                            <td><button class="join-button" onclick='showModal(${group.groupId}, "${group.groupName.replace(/"/g, '&quot;')}")'>Join</button></td>
                        `;
                        resultsTableBody.appendChild(row);
                    });

                    resultsContainer.classList.add('active');
                    showToast(`Found ${groups.length} study group${groups.length === 1 ? '' : 's'}`, 'success');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('An error occurred while searching.', 'error');
            }
        }

        function showModal(groupId, groupName) {
            groupToJoin = groupId;
            document.getElementById('modalGroupName').textContent = groupName;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            groupToJoin = null;
        }

        async function confirmJoin() {
            if (!groupToJoin) return;
            await joinGroup(groupToJoin);
            closeModal();
        }

        async function joinGroup(groupId) {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                showToast('You must be logged in to join a group', 'error');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }

            try {
                const params = new URLSearchParams({
                    user: JSON.stringify(user),
                    groupId: String(groupId)
                });

                const response = await fetch('/webproject/api/groups/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const result = await response.json();

                if (result.success) {
                    showToast(`Successfully joined the group!`, 'success');
                    setTimeout(searchStudyGroups, 1000);
                } else {
                    showToast(result.message || 'Failed to join group', 'error');
                }
            } catch (error) {
                console.error('Error joining group:', error);
                showToast('Network error. Please try again.', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('user');
            fetch('/webproject/api/auth/logout', { method: 'GET' }).finally(() => {
                window.location.href = 'login.html';
            });
        }

        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        });
    </script>
</body>
</html>
