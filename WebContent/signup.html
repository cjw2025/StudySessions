<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Study Group Platform</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Keep your existing styles */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-container {
	background: white;
	padding: 40px;
	border-radius: 10px;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
	width: 100%;
	max-width: 400px;
	text-align: center;
}

h1 {
	color: #333;
	margin-bottom: 30px;
	text-align: center;
}

.form-group {
	margin-bottom: 20px;
	text-align: left;
}

label {
	display: block;
	margin-bottom: 5px;
	color: #555;
	font-weight: 500;
}

input[type="text"], input[type="email"], input[type="password"] {
	width: 100%;
	padding: 12px;
	border: 1px solid #ddd;
	border-radius: 5px;
	font-size: 14px;
	transition: border-color 0.3s;
}

input:focus {
	outline: none;
	border-color: #667eea;
}

input[type="checkbox"] {
	width: auto;
	margin-right: 8px;
}

.btn {
	width: 100%;
	padding: 12px;
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border: none;
	border-radius: 5px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	transition: transform 0.2s;
}

.btn:hover:not(:disabled) {
	transform: translateY(-2px);
}

.btn:disabled {
	opacity: 0.6;
	cursor: not-allowed;
}

.signup-link {
	text-align: center;
	margin-top: 20px;
	color: #666;
}

.signup-link a {
	color: #667eea;
	text-decoration: none;
	font-weight: 600;
}

.signup-link a:hover {
	text-decoration: underline;
}
</style>
</head>
<body class="auth-page">
	<div class="login-container">
		<h1>Create Account</h1>

		<form method="POST" action="RegisterServlet">
			<div class="form-group">
				<label for="first_name">First Name</label> <input type="text"
					id="first_name" name="first_name" required
					placeholder="Enter your first name">
			</div>

			<div class="form-group">
				<label for="last_name">Last Name</label> <input type="text"
					id="last_name" name="last_name" required
					placeholder="Enter your last name">
			</div>

			<div class="form-group">
				<label for="email">Email</label> <input type="email" id="email"
					name="email" required placeholder="Enter your email">
			</div>

			<div class="form-group">
				<label for="phone">Phone</label> <input type="text" id="phone"
					name="phone" placeholder="Enter your phone number">
			</div>
			
			<!-- NEW PASSWORD FIELD commented out 
			<div class="form-group">
				<label for="password">Password</label> <input type="password"
					id="password" name="password" required
					placeholder="Enter a strong password">
			</div>

			<div class="form-group">
				<label for="confirm_password">Confirm Password</label> <input
					type="password" id="confirm_password" name="confirm_password"
					required placeholder="Confirm your password">
			</div>
			-->
			<div class="form-group">
				<input type="checkbox" id="terms" name="terms" required> <label
					for="terms">I agree to the Terms of Service</label>
			</div>

			<button type="submit" class="btn">Register</button>
		</form>

		<div class="signup-link">
			Already have an account? <a href="login.html">Log in</a>
		</div>
	</div>

	<script>
		// Simple client-side password confirmation check
		const form = document.querySelector('form');
		form.addEventListener('submit', function(e) {
			const password = document.getElementById('password').value;
			const confirm = document.getElementById('confirm_password').value;
			if (password !== confirm) {
				e.preventDefault();
				alert("Passwords do not match!");
			}
		});
	</script>
</body>
</html>
