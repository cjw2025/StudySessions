<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Groups – Study Sesh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #333; line-height: 1.6; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem 0; position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        nav { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: bold; }
        .nav-links { display: flex; align-items: center; gap: 2.5rem; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 1.05rem; }
        .nav-links a:hover { opacity: 0.8; }
        .user-area { font-size: 0.95rem; font-style: italic; color: rgba(255,255,255,0.95); }
        .user-area span#userName { font-weight: 600; color: white; }
        .logout-link { color: rgba(255,255,255,0.75); font-size: 0.85rem; margin-left: 10px; }
        .logout-link:hover { color: white; text-decoration: underline; }

        main { padding: 140px 2rem 4rem; max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #667eea; margin-bottom: 2rem; font-size: 2.5rem; }

        .groups-container { display: flex; flex-direction: column; gap: 1.5rem; }
        .group-card {
            background: white; border-radius: 12px; padding: 1.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .group-card:hover { transform: translateY(-5px); }
        .group-card h3 { color: #667eea; margin-bottom: 0.5rem; font-size: 1.4rem; }
        .group-card p { margin: 0.5rem 0; color: #555; }
        .no-groups { text-align: center; color: #888; font-size: 1.3rem; padding: 3rem; background: white; border-radius: 12px; }
        .create-first { margin-top: 1rem; }
        .create-first a { color: #667eea; font-weight: bold; text-decoration: none; }
        .create-first a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">Study Sesh</div>
        <div class="nav-links">
            <a href="searchForm.html">Find Groups</a>
            <a href="myGroups.html">My Groups</a>
            <a href="createGroup.html">Create Group</a>
            <div class="user-area">
                Hi, <span id="userName">Guest</span>!
                <a href="#" onclick="logout()" class="logout-link">(Logout)</a>
            </div>
        </div>
    </nav>
</header>

<main>
    <h1>My Study Groups</h1>
    <div id="groupsContainer" class="groups-container">
        <!-- Groups will be loaded here dynamically -->
        <div class="no-groups">
            Loading your groups...<br><br>
            <span style="font-size: 2rem;">(spinner)</span>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = JSON.parse(localStorage.getItem('user'));
        const nameSpan = document.getElementById('userName');
        const container = document.getElementById('groupsContainer');

        if (!user || !user.firstName) {
            window.location.href = 'login.html';
            return;
        }
        nameSpan.textContent = user.firstName;

        try {
            const response = await fetch('api/groups/my?user=' + encodeURIComponent(JSON.stringify(user)));
            const data = await response.json();

            if (data.success && data.groups.length > 0) {
                container.innerHTML = data.groups.map(g => `
                    <div class="group-card">
                        <h3>${g.className} – ${g.classCode}</h3>
                        <p><strong>Group:</strong> ${g.groupName} | <strong>Members:</strong> ${g.memberCount}</p>
                        ${g.description ? `<p><em>${g.description}</em></p>` : ''}
                        <p>Your shared calendar and events will appear here soon!</p>
                        <div style="margin-top: 1rem; padding: 1rem; background: #f0f4ff; border-radius: 8px; font-style: italic; color: #555;">
                            Calendar coming soon...
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="no-groups">
                        You haven't joined any study groups yet!<br><br>
                        <div class="create-first">
                            <a href="createGroup.html">Create your first group</a> or 
                            <a href="searchForm.html">find groups to join</a>
                        </div>
                    </div>
                `;
            }
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="no-groups">Error loading groups. Please refresh.</div>`;
        }
    });

    function logout() {
        localStorage.removeItem('user');
        fetch('api/auth/logout').finally(() => window.location.href = 'login.html');
    }
</script>

</body>
</html>
